services:
  backup-manager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      APP_SECRET: change-this-secret-before-production
    volumes:
      - backup-manager-data:/app/data
      - backup-manager-backups:/app/backups

volumes:
  backup-manager-data:
  backup-manager-backups:
