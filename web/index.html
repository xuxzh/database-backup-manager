<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据库备份管理台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login" class="login">
      <section class="login-panel">
        <h1>数据库备份管理台</h1>
        <form id="loginForm">
          <label>用户名 <input name="username" autocomplete="username" value="admin" /></label>
          <label>密码 <input name="password" type="password" autocomplete="current-password" value="admin123" /></label>
          <button type="submit">登录</button>
        </form>
        <p id="loginError" class="error"></p>
      </section>
    </main>

    <main id="app" class="app hidden">
      <aside>
        <h1>数据库备份管理台</h1>
        <button data-tab="dashboard" class="active">仪表盘</button>
        <button data-tab="sources">数据源</button>
        <button data-tab="targets">备份目标</button>
        <button data-tab="jobs">备份任务</button>
        <button data-tab="runs">运行记录</button>
      </aside>

      <section class="content">
        <header>
          <div>
            <h2 id="pageTitle">仪表盘</h2>
            <p id="pageHint">查看备份任务和最近运行状态</p>
          </div>
          <button id="refreshBtn">刷新</button>
        </header>

        <section id="dashboard" class="tab active">
          <div class="stats">
            <article><span id="sourceCount">0</span><small>数据源</small></article>
            <article><span id="targetCount">0</span><small>备份目标</small></article>
            <article><span id="jobCount">0</span><small>任务</small></article>
            <article><span id="successCount">0</span><small>今日成功</small></article>
            <article><span id="failedCount">0</span><small>今日失败</small></article>
          </div>
          <pre id="latestRun" class="log"></pre>
        </section>

        <section id="sources" class="tab">
          <form id="sourceForm" class="form-grid">
            <input name="name" placeholder="数据源名称" required />
            <select name="dbType"><option value="mysql">MySQL</option><option value="postgres">PostgreSQL</option></select>
            <input name="host" placeholder="主机" required />
            <input name="port" type="number" value="3306" required />
            <input name="username" placeholder="用户名" required />
            <input name="password" type="password" placeholder="密码" required />
            <input name="databaseName" placeholder="默认数据库" />
            <button type="submit">新增数据源</button>
          </form>
          <div id="sourceList" class="table"></div>
        </section>

        <section id="targets" class="tab">
          <form id="targetForm" class="form-grid">
            <input name="name" placeholder="目标名称" required />
            <input name="host" placeholder="SSH 主机" required />
            <input name="port" type="number" value="22" required />
            <input name="username" placeholder="SSH 用户名" required />
            <select name="authMethod"><option value="key">SSH Key</option><option value="password">密码</option></select>
            <input name="secret" type="password" placeholder="私钥或密码" required />
            <input name="baseDir" placeholder="远端基础目录" value="/data/backups" required />
            <button type="submit">新增目标</button>
          </form>
          <div id="targetList" class="table"></div>
        </section>

        <section id="jobs" class="tab">
          <form id="jobForm" class="form-grid">
            <input name="name" placeholder="任务名称" required />
            <select name="databaseConnectionId" id="jobSource"></select>
            <input name="databaseName" placeholder="备份数据库" required />
            <select name="backupTargetId" id="jobTarget"></select>
            <input name="schedule" placeholder="Cron，例如 0 0 2 * * *" value="0 0 2 * * *" required />
            <select name="compression"><option value="gzip">gzip</option></select>
            <input name="remoteRetentionDays" type="number" value="30" required />
            <input name="localRetentionDays" type="number" value="7" required />
            <label class="checkbox"><input name="enabled" type="checkbox" checked /> 启用</label>
            <button type="submit">新增任务</button>
          </form>
          <div id="jobList" class="table"></div>
        </section>

        <section id="runs" class="tab">
          <div id="runList" class="table"></div>
          <pre id="runLogs" class="log"></pre>
        </section>

        <p id="toast" class="toast"></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
